spring:
  config:
    activate:
      on-profile: staging
  datasource:
    # Staging uses connection pooler (port 6543)
    url: ${DB_URL:jdbc:postgresql://db.supabase.co:6543/postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 60000
      max-lifetime: 300000 # 5 minutes to stay ahead of Supabase idle kills
      keepalive-time: 30000
  data:
    redis:
      timeout: 5000ms
